# Configuration Nginx pour Association 100,000 Âmes (AMA)
# À placer dans /etc/nginx/sites-available/association100000ames.org

# Rate limiting pour protéger le VPS contre les abus
limit_req_zone $binary_remote_addr zone=ama_limit:10m rate=15r/s;

# 1. Redirection HTTP vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name association100000ames.org www.association100000ames.org ama-peligre.org www.ama-peligre.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Serveur Principal HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name association100000ames.org www.association100000ames.org ama-peligre.org www.ama-peligre.org;

    # Certificats SSL Let's Encrypt (générés avec certbot)
    ssl_certificate /etc/letsencrypt/live/association100000ames.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/association100000ames.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # En-têtes de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Compression GZIP optimisée pour les connexions bas débit (Plateau Central)
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 image/svg+xml;

    # Cache pour les assets statiques de Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy vers l'application Next.js (Node.js ou Docker)
    location / {
        limit_req zone=ama_limit burst=25 nodelay;
        
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
