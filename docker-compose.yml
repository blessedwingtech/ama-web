services:
  # 1. Base de Données PostgreSQL Dédiée & Isolée
  db:
    image: postgres:16-alpine
    container_name: ama_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ama_db}
      POSTGRES_USER: ${POSTGRES_USER:-ama_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AmaSecurePass2025}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ama_user} -d ${POSTGRES_DB:-ama_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ama_network

  # 2. Application Web Next.js (AMA)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ama_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ama_user}:${POSTGRES_PASSWORD:-AmaSecurePass2025}@db:5432/${POSTGRES_DB:-ama_db}?schema=public
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://ama.bittonik.com}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-AMA2025*Admin}
      PORT: 3000
    ports:
      - "127.0.0.1:3050:3000"
    networks:
      - ama_network

volumes:
  postgres_data:
    driver: local

networks:
  ama_network:
    driver: bridge
